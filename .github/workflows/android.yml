name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.JEE_GEM_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/jee-gem-signing.jks"

      - name: Build debug APK
        env:
          JEE_GEM_KEYSTORE: ${{ runner.temp }}/jee-gem-signing.jks
          JEE_GEM_STORE_PASSWORD: ${{ secrets.JEE_GEM_STORE_PASSWORD }}
          JEE_GEM_KEY_ALIAS: ${{ secrets.JEE_GEM_KEY_ALIAS }}
          JEE_GEM_KEY_PASSWORD: ${{ secrets.JEE_GEM_KEY_PASSWORD }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jee-gem-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          JEE_GEM_KEYSTORE: ${{ runner.temp }}/jee-gem-signing.jks
          JEE_GEM_STORE_PASSWORD: ${{ secrets.JEE_GEM_STORE_PASSWORD }}
          JEE_GEM_KEY_ALIAS: ${{ secrets.JEE_GEM_KEY_ALIAS }}
          JEE_GEM_KEY_PASSWORD: ${{ secrets.JEE_GEM_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
